<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#dff1fd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a1730" media="(prefers-color-scheme: dark)">
  <title>Curiosidades Yami</title>
  <style>
    :root{
      --bg1:#e6f5fe;--bg2:#cde8fb;
      --ink:#1e3a5f;--muted:#5b7394;
      --purple:#7c5cd6;--blue:#5b8fd9;
      --track:rgba(124,92,214,.16);
      --glow:none;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg1:#0d1f42;--bg2:#091428;
        --ink:#e6eefc;--muted:#8fa6cc;
        --purple:#a78bfa;--blue:#60a5fa;
        --track:rgba(255,255,255,.14);
        --glow:drop-shadow(0 0 12px rgba(167,139,250,.28));
      }
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
      display:flex;align-items:center;justify-content:center;
      padding:24px;text-align:center;overflow:hidden;
    }
    .wrap{max-width:380px;width:100%}

    .logo{
      display:block;width:min(78vw,300px);height:auto;margin:0 auto 26px;
      filter:var(--glow);
      animation:rise .45s ease-out both;
    }
    .spinner{
      width:42px;height:42px;margin:0 auto 16px;
      border:4px solid var(--track);border-top-color:var(--purple);
      border-right-color:var(--blue);
      border-radius:50%;animation:spin .8s linear infinite;
    }
    p{font-size:15px;color:var(--muted);line-height:1.5}

    .error{display:none}
    .error h1{font-size:20px;margin-bottom:10px;color:var(--ink)}
    .error p{margin-bottom:22px}
    button{
      font:inherit;font-weight:600;border:0;cursor:pointer;color:#fff;
      background:linear-gradient(135deg,#7c5cd6,#5b8fd9);
      padding:12px 28px;border-radius:14px;
      box-shadow:0 6px 16px rgba(124,92,214,.3);
    }
    button:active{transform:scale(.97)}
    body.failed .loading{display:none}
    body.failed .error{display:block}

    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes rise{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.logo{animation:none}}
  </style>
</head>

      <p id="msg">No pudimos abrir el enlace en este momento. Inténtalo de nuevo en unos segundos.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAT3Qcjb9suckipLPNXiIPrT1nN5c1_UVw",
      authDomain: "curiosidades-yami.firebaseapp.com",
      projectId: "curiosidades-yami",
      storageBucket: "curiosidades-yami.firebasestorage.app",
      messagingSenderId: "231199773076",
      appId: "1:231199773076:web:1b0d984f217b62c2f63f81"
    };

    function fail(text) {
      if (text) document.getElementById("msg").textContent = text;
      document.body.classList.add("failed");
    }

    (async () => {
      try {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const snap = await getDoc(doc(db, "config", "redirect"));

        if (!snap.exists()) {
          return fail("Todavía no hay un enlace configurado. Vuelve a intentarlo más tarde.");
        }

        const url = String(snap.data().url ?? "").trim();
        if (!url) {
          return fail("Todavía no hay un enlace configurado. Vuelve a intentarlo más tarde.");
        }
        // Seguridad: solo se redirige a enlaces https://
        if (!/^https:\/\//i.test(url)) {
          return fail("El enlace configurado no es válido. Vuelve a intentarlo más tarde.");
        }

        window.location.replace(url);
      } catch (err) {
        console.error(err);
        fail();
      }
    })();
  </script>
</body>
</html>
